<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatic Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Automatic Counter</h1>

        <div class="count-display" aria-live="polite" aria-atomic="true">
            <span id="count">0</span>
        </div>

        <div class="progress-wrap" aria-hidden="true">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <p id="msg" class="message" role="status" aria-live="polite"></p>

        <div class="controls">
            <div class="control-group">
                <label for="target">Target</label>
                <input type="number" id="target" min="1" step="1" value="10" inputmode="numeric">
            </div>
            <div class="control-group">
                <label for="speed">Speed</label>
                <select id="speed">
                    <option value="slow">Slow</option>
                    <option value="normal" selected>Normal</option>
                    <option value="fast">Fast</option>
                </select>
            </div>
        </div>

        <div class="buttons">
            <button id="start" type="button">Start</button>
            <button id="pause" type="button" disabled>Pause</button>
            <button id="resume" type="button" disabled>Resume</button>
            <button id="reset" type="button">Reset</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
